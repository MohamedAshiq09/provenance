version: "3.9"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: provenance-falkordb
    ports:
      - "6379:6379"   # FalkorDB (Redis protocol)
      - "3001:3000"   # FalkorDB Browser UI
    volumes:
      - falkor_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: provenance-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend:/app
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: provenance-ui
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkor_data:
