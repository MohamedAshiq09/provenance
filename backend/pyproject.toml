[project]
name = "provenance-backend"
version = "0.1.0"
description = "Provenance — Company Brain powered by FalkorDB graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "falkordb>=1.8.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.34.0",
    "openai>=1.50.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=1.26.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "faker>=30.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
